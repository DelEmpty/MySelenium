# --- Configurazione Principale di Cucumber ---

# Percorso delle feature files, usando il classpath per maggiore robustezza.
# 'classpath:features' punta a 'src/test/resources/features'.
cucumber.features = classpath:features

# Pacchetto delle step definitions.
# Deve puntare al package che contiene le classi degli Steps (es. SauceDemoHomeSteps).
cucumber.glue = Pages

# Plugin per il report
cucumber.plugin = pretty, html:target/cucumber-reports.html

# Gestione dei tag
cucumber.tags = ${cucumber.filter.tags:@NoTests}

# Opzioni aggiuntive
cucumber.execution.dry-run=false
cucumber.monochrome=true
